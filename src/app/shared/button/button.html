<button class="w-full flex! justify-center! items-center! rounded-lg text-[16px]" 
        [ngClass]="{
                     'bg-orange-500 btn-class hover:bg-orange-400 text-orang-50 cursor-pointer! flex justify-center items-center gap-2.5': variant() === 'primary' && !disabled(),
                     'border! border-orange-500! flex justify-center items-center btn-secondary hover:border-orange-400 hover:text-orange-400 text-orange-500 bg-white cursor-pointer': variant() ==='secondary' && !disabled(),
                    'py-2 px-4 text-[16px]': size() === 'large',
                    'py-1.5 px-3 text-[14px]': size() === 'medium',
                    'py-1 px-2 text-[12px]': size() === 'small',
                    'bg-gray-100 text-gray-500 !cursor-not-allowed': disabled() && variant() === 'primary',
                    'border border-gray-500 text-gray-500! cursor-not-allowed!': disabled() && variant() === 'secondary'}">
    <div [ngClass]="{
                      'flex! justify-between! items-center! flex-1': variant() === 'secondary' && twoIcons() === true }">
        <span>
            <i [class]="`pi pi-${iconName()}`" [ngClass]="{'hidden!': icon() === false}"></i>

            {{text()}}
        </span>

        <i [class]="`pi pi-${iconRightName()}`" [ngClass]="{'hidden!': iconRight() === false}"></i>

    </div>
</button>
