<div class="w-full max-w-[288px] bg-white rounded-2xl flex flex-col justify-center gap-5 items-center border-[0.5px] border-gray-200 p-9 shadow-[0px_2px_4px_-2px_#0000001A,0px_4px_6px_-1px_#0000001A]">

    <div class="rounded-full overflow-hidden">
        <img [src]="img()" alt="person1" class="w-32 h-32">
    </div>

    <div class="text-center">
        <p class="font-semibold text-blue-950 text-[18px]"> {{name()}}</p>
        <p class="text-[18px] text-orange-500"> {{position()}} </p>
        <p class="text-[16px] text-gray-500">
           {{desc()}}
        </p>
    </div>

    <div class="flex gap-4">
        <a [href]="hrefLinkOne()"><i class="pi pi-linkedin text-[#0A66C2] text-[23px]!"></i></a>
         <a [href]="hrefLinkTwo()"><i class="pi pi-facebook text-[#0A66C2] text-[23px]!"></i></a>
        <a [href]="hrefLinkThree()"><i class="pi pi-github text-[#0A66C2] text-[23px]!"></i></a>
    </div>

</div>
