<div class="bg-white rounded-lg border-[0.5px] border-gray-200 flex flex-col gap-4.75 w-full max-w-92.75 py-6 px-4">
    <div class="flex justify-start items-center gap-2">
        <div class="rounded-full w-12 h-12 overflow-hidden">
            <img [src]="img()" alt="user feedback">
        </div>
        <div class="flex flex-col gap-1 w-full">
            <div class="flex w-full justify-between items-center">
                <p class="font-bold text-[16px] text-[#111827]">
                    {{name()}}
                </p>
                <div class="flex gap-1">
                    <i class="pi pi-star-fill text-[#EAB308] text-[18px]!"></i>
                    <i class="pi pi-star-fill text-[#EAB308] text-[18px]!"></i>
                    <i class="pi pi-star-fill text-[#EAB308] text-[18px]!"></i>
                    <i class="pi pi-star-fill text-[#EAB308] text-[18px]!"></i>
                    <i class="pi pi-star-fill text-[#EAB308] text-[18px]!"></i>
                </div>
            </div>


            <p class="text-gray-400 text-[14px]">
                {{desc()}}
            </p>
        </div>

    </div>
    <div>
        <p class="text-gray-600 text-[16px]">
            {{content()}}
        </p>
    </div>
</div>
