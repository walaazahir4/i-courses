<nav class="bg-white fixed top-0 w-full border-[0.5px] border-gray-200 p-4 z-90">
    <div class="" [ngClass]="{'flex! justify-between items-center!': !isLoggedIn(),
                     'flex! justify-center! items-center': isLoggedIn()
         }">
        @if(isLoggedIn()){
       <div class="flex justify-between items-center">
         <div>
            <img src="./images/logo.svg" alt="logo" class="w-16.25 h-15">
        </div>
        <div>
            <p class="text-orange-500 font-semibold text-[18px]">
                العودة الي الصفحة الرئيسية
            </p>
        </div>
       </div>
        } @else{
        <div class="flex justify-center gap-10 items-center">
            <div>
                <img src="./images/logo.svg" alt="logo" class="w-16.25 h-15">
            </div>
            <div class="flex justify-center gap-10 ">
                <ul class="flex gap-6.5 items-center text-gray-400">
                    <li><a href="#الرئيسية">الرئيسية</a></li>
                    <li><a href="#المسارات">المسارات</a></li>
                    <li><a href="">الدعم الفني</a></li>
                    <li><a href="">من نحن</a></li>
                </ul>

                <div>
                    <icourse-input [label]="''" [size]="'small'" [placeholder]="'البحث'" [leftIcon]="true"
                        [leftIconName]="'search'"></icourse-input>
                </div>

                <div class="flex justify-between gap-9">
                    <icourse-button [variant]="'secondary'" [text]="'سجل الان'"></icourse-button>
                    <icourse-button [text]="'تسجيل دخول'"></icourse-button>
                </div>
            </div>
        </div>
        }
    </div>
