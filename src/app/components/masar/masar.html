<div class="flex flex-col justify-center items-center gap-13 py-8"
     id="المسارات">
    <div class="flex flex-col justify-center items-center gap-4">
        <p class="text-blue-hue-950 font-bold text-[32px]">مسارات التعلم! </p>
        <p class="text-gray-500 text-[18px] lg:p-0 p-3 text-center">اختر رحلة التعلم الخاصة بك من مساراتنا المصممة بعناية والمصممة لتأخذك منها
            من المبتدئين إلى المحترفين.</p>
    </div>

    <div class="w-full justify- max-w-327.5 overflow-hidden flex flex-col lg:flex-row gap-3 "
         >
        @for(card of  cards; track $index){
        <icourse-feature-card class="flex justify-center" [img]="card.img"></icourse-feature-card>
        }

    </div>
    <div class="w-full max-w-59.25">
        <icourse-button [variant]="'secondary'" 
                        [text]="'عرض جميع الدورات'"></icourse-button>
    </div>
</div>
