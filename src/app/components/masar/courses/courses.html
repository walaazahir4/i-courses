<div class="pb-5 mt-20 flex flex-col gap-4 justify-center items-center bg-gray-50" id="courses">
    <div class="flex w-full items-center justify-between p-9" dir="rtl">

        <!-- Right -->
        <div>
            <p class="font-bold text-[32px] text-blue-hue-950">
                جميع الكورسات
            </p>
        </div>

        <!-- Left -->
        <div class="flex items-center gap-3" dir="ltr">

            <!-- Filter -->
            <div class="relative">
                <button type="button" (click)="toggleFilter()" class="flex items-center gap-2 rounded-lg border border-gray-300
                       bg-white px-4 py-2.5 text-sm font-medium text-gray-700
                       hover:border-orange-500">
                    <i class="pi pi-filter"></i>
                    <span>Filter</span>
                    <i class="pi pi-chevron-down text-xs transition-transform" [class.rotate-180]="isFilterOpen()"></i>
                </button>

                @if (isFilterOpen()) {
                <div class="absolute left-0 top-full z-50 mt-2 w-48
                           overflow-hidden rounded-lg border border-gray-200
                           bg-white shadow-lg">
                    <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">
                        All
                    </button>

                    <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">
                        Active
                    </button>

                    <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">
                        Inactive
                    </button>
                </div>
                }
            </div>


            <!-- Sort -->
            <div class="relative">
                <button type="button" (click)="toggleSort()" class="flex items-center gap-2 rounded-lg border border-gray-300
                       bg-white px-4 py-2.5 text-sm font-medium text-gray-700
                       hover:border-orange-500">
                    <i class="pi pi-sort-alt"></i>
                    <span>{{ selectedSort() }}</span>
                    <i class="pi pi-chevron-down text-xs transition-transform" [class.rotate-180]="isSortOpen()"></i>
                </button>

                @if (isSortOpen()) {
                <div class="absolute left-0 top-full z-50 mt-2 w-56
                           overflow-hidden rounded-lg border border-gray-200
                           bg-white shadow-lg">
                    <button type="button" (click)="selectedSort.set('الأحدث'); isSortOpen.set(false)"
                        class="block w-full px-4 py-3 text-right text-sm hover:bg-orange-50">
                        الأحدث
                    </button>

                    <button type="button" (click)="selectedSort.set('الأقدم'); isSortOpen.set(false)"
                        class="block w-full px-4 py-3 text-right text-sm hover:bg-orange-50">
                        الأقدم
                    </button>

                    <button type="button" (click)="selectedSort.set('الأعلى تقييمًا'); isSortOpen.set(false)"
                        class="block w-full px-4 py-3 text-right text-sm hover:bg-orange-50">
                        الأعلى تقييمًا
                    </button>
                </div>
                }
            </div>

        </div>
    </div>

    <div class="flex flex-col gap-3">
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
    </div>
</div>
