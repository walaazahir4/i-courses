<div class="pb-5 mt-20 flex flex-col gap-4 justify-center items-start bg-gray-50" id="courses">
    <div class="flex w-full items-start gap-6 px-18" dir="ltr">
        @if (isFilterPanelOpen()) {
            <icourse-filter class="w-96 shrink-0"></icourse-filter>
        }
        <div class="flex items-end min-w-0 flex-1 flex-col gap-3 py-9">
            <div class="flex w-full max-w-[1126.44px] items-center justify-between" dir="rtl">
                <div>
                    <p class="font-bold text-[32px] text-blue-hue-950">
                        جميع الكورسات
                    </p>
                </div>

                <div class="flex items-center gap-3" dir="ltr">
                    <div class="relative">
                        <button type="button" (click)="toggleFilter()" class="flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:border-orange-500">
                            <i class="pi pi-filter"></i>
                            <span>فرز حسب</span>
                            <i class="pi pi-chevron-down text-xs transition-transform" [class.rotate-180]="isFilterOpen()"></i>
                        </button>

                        @if (isFilterOpen()) {
                            <div class="absolute left-0 top-full z-50 mt-2 w-48
                                        overflow-hidden rounded-lg border border-gray-200
                                        bg-white shadow-lg">
                                <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">الكل</button>
                                <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">الأعلى تقييم</button>
                                <button class="block w-full px-4 py-3 text-left text-sm hover:bg-orange-50">الأقدم</button>
                            </div>
                        }
                    </div>

                    <button
                        type="button"
                        (click)="toggleFilterPanel()"
                        class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:border-orange-500 cursor-pointer">
                        <i class="pi pi-align-center text-orange-500"></i>
                        <span>فلتر</span>
                    </button>
                </div>
            </div>

            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
            <icourse-data-card [type]="'large'" [paginate]="false"></icourse-data-card>
        </div>
    </div>
</div>
