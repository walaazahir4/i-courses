<div class="bg-gray-100 flex flex-col gap-8.75 py-20">
    <div class="flex flex-col justify-center items-center gap-4">
        <p class="text-blue-hue-950 font-bold text-[32px]"> لماذا تختار منصتنا! </p>
        <p class="text-gray-500 text-[18px]">
            تم تصميم منصتنا لتزويدك بأفضل تجربة تعليمية ممكنة ، مع الميزات التي تميزنا عن دورات التصميم الأخرى.
        </p>
    </div>
    <div class="flex w-full gap-8 justify-center items-center">
        @for(card of cards; track $index){
        <icourse-info-card [title]="card.title"
                           [icon]="card.icon"
                           [desc]="card.desc"></icourse-info-card>
        }
    </div>
</div>
