<div class="bg-blue-hue-50 flex justify-center items-center p-20">

    <form action="" class="rounded-lg bg-white flex flex-col p-8 w-full max-w-161">
        <div class="flex flex-col justify-center items-center gap-4 pb-8">
            <p class="font-bold text-[32px] text-blue-hue-950"> أنشئ حسابك الان </p>
            <p class="text-blue-hue-950 text-[18px] font-semibold"> انضم إلى الآلاف من المصممين وابدأ رحلة اليوم! </p>
        </div>
        @if(!hasAccount()){
        <div class="flex flex-col gap-4">
            <icourse-input [label]="' الاسم الكامل '" [placeholder]="'ادخل الاسم بالكامل'" [leftIcon]="true"
                [leftIconName]="'user'" [inputType]="'text'"></icourse-input>
            <icourse-input [label]="'  عنوان البريد الإلكتروني '" [placeholder]="'ادخل اعنوان البريد الالكتروني'"
                [leftIcon]="true" [leftIconName]="'envelope'" [inputType]="'email'"></icourse-input>
            <icourse-input [label]="'  كلمة المرور '" [placeholder]="'ادخل كلمه المرور الخاصه بك'" [leftIcon]="true"
                [leftIconName]="'lock'" [rightIcon]="true" [rightIconName]="'eye'"
                [inputType]="'password'"></icourse-input>
            <icourse-input [label]="'   تأكيد كلمة المرور '" [placeholder]="'تاكيد كلمه المرور'" [leftIcon]="true"
                [leftIconName]="'lock'" [rightIcon]="true" [rightIconName]="'eye'"
                [inputType]="'password'"></icourse-input>
            <div class="flex items-center! gap-2  pb-3">
                <input type="checkbox" id="terms" class="w-4 h-4" />

                <label for="terms" class=" text-blue-hue-950 text-[16px] font-semibold  cursor-pointer">
                    <!--  -->
                    أوافق على <span class="text-orange-500 underline"> شروط الخدمة وسياسة الخصوصية </span>
                </label>
            </div>
        </div>
        } @else {
        <div class="flex flex-col gap-4">
            <icourse-input [label]="'  عنوان البريد الإلكتروني '" [placeholder]="'ادخل اعنوان البريد الالكتروني'"
                [leftIcon]="true" [leftIconName]="'envelope'" [inputType]="'email'"></icourse-input>
            <icourse-input [label]="'  كلمة المرور '" [placeholder]="'ادخل كلمه المرور الخاصه بك'" [leftIcon]="true"
                [leftIconName]="'lock'" [rightIcon]="true" [rightIconName]="'eye'"
                [inputType]="'password'"></icourse-input>

          <div class="flex justify-between items-center pb-8">
              <div class="flex items-center! gap-2  pb-3">
                <input type="checkbox" id="rem" class="w-4 h-4" />

                <label for="rem" class=" text-blue-hue-950 text-[16px] font-semibold  cursor-pointer">
                    تذكرني
                </label>
            </div>

            <p class="text-orange-500 text-[18px]"><a href="">هل نسيت كلمة المرور؟</a></p>
          </div>
        </div>
        }
        <div>
            <icourse-button [text]="'سجل الان'"></icourse-button>
        </div>
        <div class="flex items-center gap-4 pt-4">
            <div class="flex-1 h-px bg-gray-300"></div>

            <span class="text-gray-500 text-sm"> أو من خلال </span>

            <div class="flex-1 h-px bg-gray-300"></div>
        </div>

        <div class="flex justify-center items-center w-full gap-6 pt-7">


            <div
                class="cursor-pointer rounded-full border border-blue-hue-100 w-13 h-13 flex justify-center items-center">
                <a href=""> <img src="./images/gmail.svg" alt="" class="w-6 h-6"> </a>
            </div>
            <div
                class="cursor-pointer rounded-full border border-blue-hue-100 w-13 h-13 flex justify-center items-center">
                <a href=""> <i class="pi pi-facebook text-[#1877F2] text-[25px]!"></i></a>
            </div>
            <div
                class="cursor-pointer rounded-full border border-blue-hue-100 w-13 h-13 flex justify-center items-center">
                <a href=""> <i class="pi pi-apple text-[25px]!"></i></a>
            </div>


        </div>

        <div class="flex justify-center items-center w-full gap-2 pt-5">
            <span>هل لديك حساب بالفعل؟ </span>
            <span class="text-orange-500"><a href=""> تسجيل الدخول </a></span>
        </div>
    </form>

</div>
